# Compass's annotations for RCOS-Core 0.1.
#
# Kept separate from the standard's own data, and not published upstream, because
# these are this tool's opinion rather than properties of RCOS:
#
#   question   the plain-language form of the section, as it appears on the
#              dashboard and the Path. A member should recognise their own
#              situation in it without having read the clause.
#   effort     one_conversation | one_meeting | a_series — so a group can plan a
#              season rather than a decade.
#   dependsOn  sections that make this one easier or safer to answer first. The
#              Path treats these as structural ordering.
#
# Every authored section is annotated. Layers 0 and 1 came first, for P3 and a
# pilot community's first month; 2–6 followed, because a Path that mixed "Why
# does this community exist — in one sentence that will still be true in ten
# years?" with "Entry Format" and "Triggers" was asking a group to recognise its
# own situation in a table of contents. A section title names a container; a
# question names the thing a community has to decide, and it is a title somebody
# can open a discussion under without rewriting it.
#
# Layers 2–6 all carry `effort: one_meeting` and no dependencies — the same
# values the Path already assumed for an unannotated section. That is deliberate
# rather than lazy: adding questions was meant to change the wording and nothing
# else, so the order of the Path is exactly what it was. Sharpening effort and
# dependencies for these layers is its own piece of work, with its own argument.
#
# Every authored section must have one — `pnpm check:standard` fails otherwise.
# The loader still falls back to the template title, so a section without one
# would load; the check is what keeps a heading off the Path.
#
# A question must cover what the clauses its section owns require, and must not
# ask about what another section owns. The Path cites those clauses beside it,
# so a question that drifts from them is visible to anyone reading the item —
# that is how "what happens to their things?" was caught on Voluntary Exit,
# where the things are Asset, Role, and Responsibility Separation's (§3.6.5).

sections:
  # ---- Layer 0 · Identity & Scope -----------------------------------------

  purpose-charter.primary-purpose:
    question: Why does this community exist — in one sentence that will still be true in ten years?
    effort: a_series
    dependsOn: []

  purpose-charter.secondary-purposes:
    question: What secondary purposes do we pursue — without competing with why we exist?
    effort: one_meeting
    dependsOn: [purpose-charter.primary-purpose]

  purpose-charter.non-goals-and-exclusions:
    question: What are we deliberately not, however tempting it becomes?
    effort: one_meeting
    dependsOn: [purpose-charter.primary-purpose]

  purpose-charter.conditions-for-purpose-change:
    question: What would it take to change why we exist — and who would have to agree?
    effort: one_meeting
    dependsOn: [purpose-charter.primary-purpose]

  purpose-charter.ratification-record:
    question: Who adopted this charter, when, and how was it decided?
    effort: one_conversation
    dependsOn: [purpose-charter.primary-purpose]

  scope-declaration.in-scope-assets:
    question: What does the community own or steward together?
    effort: one_meeting
    dependsOn: [purpose-charter.primary-purpose]

  scope-declaration.in-scope-decision-domains:
    question: Which decisions belong to the group rather than to individuals?
    effort: one_meeting
    dependsOn: [scope-declaration.in-scope-assets]

  scope-declaration.in-scope-activities-and-responsibilities:
    question: Which work and responsibilities are collective?
    effort: one_meeting
    dependsOn: [scope-declaration.in-scope-decision-domains]

  scope-declaration.explicitly-out-of-scope:
    question: What is none of the community's business — and stays that way?
    effort: one_meeting
    dependsOn: [scope-declaration.in-scope-assets]

  scope-declaration.ratification-record:
    question: Who adopted this scope, when, and how was it decided?
    effort: one_conversation
    dependsOn: [scope-declaration.in-scope-assets]

  invariants-register.active-invariants:
    question: What must never happen here, whatever the circumstances or the majority?
    effort: a_series
    dependsOn: [purpose-charter.primary-purpose]

  invariants-register.ratification-record:
    question: Who adopted these invariants, when, and how was it decided?
    effort: one_conversation
    dependsOn: [invariants-register.active-invariants]

  identity-constraints-register.active-identity-constraints:
    question: Which non-negotiable rules follow from who we are as a community — about behaviour, joining, culture or land?
    effort: a_series
    dependsOn: [purpose-charter.primary-purpose, invariants-register.active-invariants]
    prompts:
      - Which rules hold for everyone taking part, whatever a majority wants on a given day?
      - "For each one: who does it apply to?"
      - What does it mean for them in practice — what may they not do, or what must be true before they can join?
      - Why is it needed — what would go wrong here without it?
    examples:
      - Only people aged 18 or over can become members.
      - No belief system, religion or political view may be required to join or take part.
      - Nothing the community does may cause lasting harm to the land it stewards; every land and building decision says how it was checked.

  identity-constraints-register.enforcement-and-testability:
    question: How would anyone check whether a constraint is being met — and what happens if it is not?
    effort: one_meeting
    dependsOn: [identity-constraints-register.active-identity-constraints]
    prompts:
      - "For each rule: how would anyone notice that it is not being kept?"
      - Which written process handles a breach, so it is not left to whoever objects loudest?
      - Who keeps an eye on it, and how often is that looked at again?

  identity-constraints-register.conditions-for-change:
    question: How are our non-negotiables changed and ratified — and can every member always read the current version?
    effort: one_conversation
    dependsOn: [identity-constraints-register.active-identity-constraints]

  identity-constraints-register.ratification-record:
    question: Who adopted these constraints, when, and how was it decided?
    effort: one_conversation
    dependsOn: [identity-constraints-register.active-identity-constraints]

  # ---- Layer 1 · Membership ------------------------------------------------

  membership-state-registry.defined-membership-states:
    question: Which membership states do we have — at least applicant, trial, full and exited — and what are their rights, obligations and limitations?
    effort: one_meeting
    dependsOn: [purpose-charter.primary-purpose]

  membership-state-registry.ratification-record:
    question: Who adopted the membership states, when, and how was it decided?
    effort: one_conversation
    dependsOn: [membership-state-registry.defined-membership-states]

  onboarding-protocol.admission-criteria:
    question: Who can join, on which written criteria, and who decides — so nobody becomes a member just by being around?
    effort: a_series
    dependsOn: [membership-state-registry.defined-membership-states]
    prompts:
      - Which criteria must an applicant meet, written so anyone could check them?
      - Who decides an application? (Name the body the Decision Matrix gives admissions to, rather than a second rule.)
      - How do we make sure nobody becomes a member informally, or after the fact?

  onboarding-protocol.onboarding-steps:
    question: What actually happens between "I'd like to join" and "I'm in"?
    effort: one_meeting
    dependsOn: [onboarding-protocol.admission-criteria]

  onboarding-protocol.initial-membership-state:
    question: What is someone on their first day — and what can they do yet?
    effort: one_conversation
    dependsOn: [membership-state-registry.defined-membership-states]

  onboarding-protocol.trial-and-evaluation:
    question: How long is someone new on trial, what are they judged on, who decides — and what happens if it does not work out?
    effort: one_meeting
    dependsOn: [onboarding-protocol.initial-membership-state]

  onboarding-protocol.completion-record:
    question: How do we record that someone has finished joining — and can every member read the rules they agreed to?
    effort: one_conversation
    dependsOn: [onboarding-protocol.onboarding-steps]

  onboarding-protocol.ratification-record:
    question: Who adopted this onboarding process, when, and how was it decided?
    effort: one_conversation
    dependsOn: [onboarding-protocol.onboarding-steps]

  membership-agreement.membership-state-on-signing:
    question: What is someone agreeing to be, at the moment they sign?
    effort: one_conversation
    dependsOn: [membership-state-registry.defined-membership-states]

  membership-agreement.member-rights:
    question: "What are each member's rights, in proportion to what we ask of them?"
    effort: one_meeting
    dependsOn: [membership-state-registry.defined-membership-states]

  membership-agreement.member-obligations:
    question: What does the community expect of each member — and where does that expectation stop?
    effort: one_meeting
    dependsOn: [membership-agreement.member-rights]

  membership-agreement.participation-and-contribution-expectations:
    question: What counts as participation, how much is enough, may someone send a stand-in — and what happens when someone stops?
    effort: a_series
    dependsOn: [membership-agreement.member-obligations]

  membership-agreement.due-process-reference:
    question: What protects a member when the community turns against them?
    effort: one_conversation
    dependsOn: [membership-agreement.member-rights]

  membership-agreement.consent-acknowledgment:
    question: How does someone show they have read and agreed to all of this?
    effort: one_conversation
    dependsOn: [membership-agreement.member-obligations]

  membership-agreement.ratification-record:
    question: Who adopted this agreement, when, and how was it decided?
    effort: one_conversation
    dependsOn: [membership-agreement.member-rights]

  exit-protocol.voluntary-exit:
    question: How can someone leave whenever they choose — without being punished for it, or losing more than their membership?
    effort: one_meeting
    dependsOn: [membership-state-registry.defined-membership-states]
    prompts:
      - How does someone tell us they are leaving — and do they owe anyone a reason or a vote?
      - When does their access end, and where is the exit recorded?
      - Which rights end with membership, and which do they keep because they never depended on it?
    examples:
      - Any member can leave the community at any time by informing the community in writing. They do not need permission or a vote to leave. The community records the exit date and follows the agreed process for returning personal belongings, settling outstanding payments, and ending membership-related responsibilities. Leaving means giving up rights that exist only because of membership, such as access to shared facilities or participation in governance. It does not remove any rights the person has independently of membership, such as ownership of their personal belongings or money the community owes them.

  exit-protocol.forced-exit:
    question: What has to be true before the community can ask someone to leave?
    effort: a_series
    dependsOn: [exit-protocol.voluntary-exit, membership-agreement.due-process-reference]

  exit-protocol.suspension:
    question: Can someone be paused rather than removed — for how long, reviewed by whom, and never as a punishment in disguise?
    effort: one_meeting
    dependsOn: [exit-protocol.forced-exit]

  exit-protocol.asset-role-and-responsibility-separation:
    question: When someone leaves, what happens to their roles, tasks, access and anything they hold for us — agreed before anyone leaves?
    effort: one_meeting
    dependsOn: [exit-protocol.voluntary-exit]

  exit-protocol.ratification-record:
    question: Who adopted this exit protocol, when, and how was it decided?
    effort: one_conversation
    dependsOn: [exit-protocol.voluntary-exit]

  # ---- Layer 2 · Governance ------------------------------------------------

  authority-registry.registered-authorities:
    question: Which roles, circles or bodies hold authority here — and what are the scope, limits and term of each?
    effort: one_meeting
    dependsOn: []
    prompts:
      - Which roles, circles or bodies may decide anything? (The full members together are one of them.)
      - "For each: what may it decide, and where does that stop?"
      - "For each: for how long does it hold that authority, and how is it renewed or ended?"
      - Where does each get its authority from — never seniority, ownership, charisma or being a founder?
      - Which temporary or emergency authority do we allow, how is it time-bounded, and how is it reviewed afterwards?

  decision-matrix.decision-type-definitions:
    question: What kinds of decision do we make, and how do we tell a big one from a small one?
    effort: one_meeting
    dependsOn: []

  decision-matrix.voting-principles:
    question: For each kind of decision, who gets a say, what counts as agreement, who can block it, and how long does it stay open?
    effort: one_meeting
    dependsOn: []

  decision-matrix.matrix:
    question: Which decisions belong to whom — in one table we can point at mid-argument?
    effort: one_meeting
    dependsOn: []

  governance-protocol.proposal-submission:
    question: How does someone put a proposal in front of us, and what has to be in it?
    effort: one_meeting
    dependsOn: []

  governance-protocol.review-and-deliberation:
    question: How long do we sit with a proposal before deciding, and who has to be heard first?
    effort: one_meeting
    dependsOn: []

  governance-protocol.decision-execution:
    question: Once we have decided something, who carries it out and by when?
    effort: one_meeting
    dependsOn: []

  governance-protocol.documentation-and-publication:
    question: Where does a decision get written down, and who can read it afterwards?
    effort: one_meeting
    dependsOn: []

  governance-protocol.appeal-and-review:
    question: If someone thinks a decision went wrong, how do they get it looked at again?
    effort: one_meeting
    dependsOn: []

  governance-protocol.conflict-between-decisions:
    question: When two of our own decisions contradict each other, which one wins?
    effort: one_meeting
    dependsOn: []

  governance-protocol.safeguards-and-failure-modes:
    question: What stops power collecting in a few hands, lets anyone challenge a decision safely, and forces a review when governance keeps failing?
    effort: one_meeting
    dependsOn: []
    prompts:
      - What stops decision power concentrating in one person or a small group?
      - What stops an informal veto — someone blocking a decision outside the agreed process?
      - What stops a subgroup capturing decisions, for example by turning up only when it suits them?
      - What stops founders or long-standing role holders becoming entrenched?
      - How can anyone challenge a decision without fear of retaliation?
      - Which pattern of failures forces a formal review — and who starts it?


  # ---- Layer 3 · Resources & Economy ---------------------------------------

  internal-economy-protocol.commons-vs-private-classification:
    question: What belongs to all of us, what stays personal, and where is that written down?
    effort: one_meeting
    dependsOn: []

  internal-economy-protocol.recognized-contribution-categories:
    question: Which kinds of work do we count as contribution — including the work nobody sees?
    effort: one_meeting
    dependsOn: []

  internal-economy-protocol.contribution-recognition-mechanism:
    question: How do we keep track of and recognise contributions — and what, if anything, does recognition unlock?
    effort: one_meeting
    dependsOn: []
    prompts:
      - How is a contribution recorded or acknowledged, and by whom?
      - Who may confirm a record? (Contesting one is its own question.)
      - Does recognition give any benefits, responsibilities or access to shared resources?
      - How do we make sure recognition never gives extra say in decisions beyond what the Decision Matrix grants?

  internal-economy-protocol.internal-units:
    question: If we use our own credits or hours, who issues them and what can they be used for?
    effort: one_meeting
    dependsOn: []

  internal-economy-protocol.accumulation-constraints:
    question: What stops one person accumulating enough to steer everything — and how would we notice?
    effort: one_meeting
    dependsOn: []

  internal-economy-protocol.external-income-interfaces:
    question: How does money from outside reach us, and on what terms?
    effort: one_meeting
    dependsOn: []

  internal-economy-protocol.dispute-resolution-for-economic-records:
    question: When someone says the record of their contribution is wrong, how is that settled?
    effort: one_meeting
    dependsOn: []

  treasury-ruleset.treasury-scope:
    question: What is held in common — and where does the shared purse end and a personal one begin?
    effort: one_meeting
    dependsOn: []

  treasury-ruleset.income-sources:
    question: Where does our money come from, and what are we relying on?
    effort: one_meeting
    dependsOn: []

  treasury-ruleset.spending-authority:
    question: Who can spend how much without asking, who approves the rest, and how is every spend recorded?
    effort: one_meeting
    dependsOn: []

  treasury-ruleset.transparency-and-reporting:
    question: Who can see the accounts, how often, and what may be held back?
    effort: one_meeting
    dependsOn: []

  treasury-ruleset.reserve-risk-and-debt-constraints:
    question: How much may we owe, and how much do we keep aside for a bad year?
    effort: one_meeting
    dependsOn: []

  treasury-ruleset.conflict-of-interest-rules:
    question: What does someone do when a decision about money would benefit them personally?
    effort: one_meeting
    dependsOn: []


  # ---- Layer 4 · Conflict & Accountability ---------------------------------

  accountability-protocol.triggers:
    question: What has to happen before the accountability process starts, and who can start it?
    effort: one_meeting
    dependsOn: []

  accountability-protocol.investigation-and-review:
    question: Who looks into what happened, and how do they do it without taking sides?
    effort: one_meeting
    dependsOn: []

  accountability-protocol.due-process-guarantees:
    question: What is someone accused of something entitled to, before anything is decided?
    effort: one_meeting
    dependsOn: []

  accountability-protocol.anti-retaliation-protections:
    question: How do we protect someone who raises a concern from paying for it later?
    effort: one_meeting
    dependsOn: []

  accountability-protocol.sanction-and-repair-options:
    question: What consequences can follow, how are they kept proportionate and open to appeal — and how does repair come before punishment?
    effort: one_meeting
    dependsOn: []
    prompts:
      - Which consequences can follow a breach — and which repair steps come before any punishment?
      - "For each consequence: what has to be shown first, and what evidence is enough?"
      - "For each consequence: who may apply it, how long does it last, and how is it appealed?"
      - How do we make sure nobody is punished informally — by exclusion, silence or social pressure?

  accountability-protocol.conditions-for-restoring-rights:
    question: How does someone get their standing back once a sanction has run its course?
    effort: one_meeting
    dependsOn: []

  accountability-protocol.coordination-with-layer-1:
    question: When accountability ends in somebody leaving, which rules apply — these or the exit protocol?
    effort: one_meeting
    dependsOn: []

  conflict-resolution-ladder.conflict-classification:
    question: What kinds of conflict do we have names for, so nobody invents one mid-argument — and which are safety-critical?
    effort: one_meeting
    dependsOn: []
    prompts:
      - Which kinds of conflict do we name — at least interpersonal, role-based, structural and ethical?
      - Which situations are safety-critical, and what changes for them?
      - "For each kind: how do we recognise it, how quickly must we respond, and which path does it take?"
      - "For each kind: what gets written down? (Who may read it is its own question.)"
      - What happens when a conflict is put in the wrong kind, or nobody classifies it?

  conflict-resolution-ladder.resolution-ladder-steps:
    question: What are the steps from a quiet word to a formal process, and in what order?
    effort: one_meeting
    dependsOn: []

  conflict-resolution-ladder.non-response-withdrawal-and-deadlock:
    question: What happens when somebody will not take part, walks out, or we simply get stuck?
    effort: one_meeting
    dependsOn: []

  conflict-resolution-ladder.facilitator-selection-and-replacement:
    question: Who facilitates a conflict, and how does either side get them replaced?
    effort: one_meeting
    dependsOn: []

  conflict-resolution-ladder.privacy-and-information-access-boundaries:
    question: Who is allowed to know what about a conflict, while it runs and afterwards?
    effort: one_meeting
    dependsOn: []

  conflict-resolution-ladder.safeguards:
    question: What changes when the people in a conflict do not have equal power — or when someone is not safe?
    effort: one_meeting
    dependsOn: []
    prompts:
      - What extra protection applies when the people in a conflict do not have equal power — for example independent facilitation, or a separate way to raise it?
      - When someone is not safe, what may we do at once, before the process ends — and who decides?
      - How do we make sure safety comes before participation rights, roles and convenience?


  # ---- Layer 5 · Operations ------------------------------------------------

  role-registry.overview:
    question: Which ongoing jobs have a name and a person, rather than being everybody's and nobody's?
    effort: one_meeting
    dependsOn: []

  role-registry.operational-roles:
    question: For each role that keeps things running, what is it answerable for and who reviews that?
    effort: one_meeting
    dependsOn: []

  role-registry.functional-roles:
    question: Which roles exist for a function rather than for daily work, and what are they for?
    effort: one_meeting
    dependsOn: []

  operations-manual.core-operational-processes:
    question: Which things have to keep happening every week — and are they written down anywhere?
    effort: one_meeting
    dependsOn: []

  operations-manual.temporary-and-ad-hoc-responsibilities:
    question: How do we stop a temporary favour becoming somebody's permanent unpaid job?
    effort: one_meeting
    dependsOn: []

  operations-manual.role-and-domain-interfaces:
    question: Where does one role's work end and the next one's begin?
    effort: one_meeting
    dependsOn: []

  operations-manual.workload-boundaries:
    question: How much time, meeting and care can we ask of one person — and what happens when someone is overloaded?
    effort: one_meeting
    dependsOn: []

  operations-manual.operational-continuity:
    question: If any one of us disappeared for a month, what would stop working?
    effort: one_meeting
    dependsOn: []

  operations-manual.information-flow-and-anti-gatekeeping:
    question: How do we make sure nobody has to go through one person to find something out?
    effort: one_meeting
    dependsOn: []

  operations-manual.documentation-locations-and-update-procedures:
    question: What do we write down, where, and who may read it — and can every decision be traced to who made it and how?
    effort: one_meeting
    dependsOn: []

  meeting-templates.meeting-type-operations:
    question: How do we run the meeting where the week's work gets sorted out?
    effort: one_meeting
    dependsOn: []

  meeting-templates.meeting-type-governance:
    question: How do we run the meeting where decisions actually get made?
    effort: one_meeting
    dependsOn: []

  meeting-templates.meeting-type-coordination-alignment:
    question: How do we run the meeting that keeps separate work from drifting apart?
    effort: one_meeting
    dependsOn: []

  meeting-templates.meeting-type-reflection-learning:
    question: How do we run the meeting where we look back rather than forward?
    effort: one_meeting
    dependsOn: []

  meeting-templates.meeting-type-conflict-handling:
    question: How do we run a meeting whose subject is a conflict?
    effort: one_meeting
    dependsOn: []


  # ---- Layer 6 · Change & Learning -----------------------------------------

  change-protocol.how-changes-are-proposed:
    question: How does somebody propose changing a rule we have already agreed?
    effort: one_meeting
    dependsOn: []

  change-protocol.how-proposals-are-classified:
    question: How do we tell a small adjustment from a change to who we are — and a permanent change from an experiment?
    effort: one_meeting
    dependsOn: []

  change-protocol.review-and-deliberation:
    question: How long does a proposed change have to sit before we are allowed to adopt it?
    effort: one_meeting
    dependsOn: []

  change-protocol.adoption-and-publication:
    question: When a change is adopted, how does everyone find out, and from when does it apply?
    effort: one_meeting
    dependsOn: []

  change-protocol.rejection:
    question: What happens to a rejected proposal — can it come back, and how soon?
    effort: one_meeting
    dependsOn: []

  change-protocol.transition-and-migration:
    question: What extra care does a change that is hard to undo need — and what happens to what is already running under the old rule?
    effort: one_meeting
    dependsOn: []

  change-protocol.rollback:
    question: If a change turns out badly, how do we undo it?
    effort: one_meeting
    dependsOn: []

  change-protocol.emergency-changes:
    question: What may we decide in a hurry, who may do it, and when does it expire?
    effort: one_meeting
    dependsOn: []

  change-protocol.experiments:
    question: How do we try something for a while without it quietly becoming permanent?
    effort: one_meeting
    dependsOn: []

  experiment-template.required-fields:
    question: What does somebody have to write down before we agree to try something?
    effort: one_meeting
    dependsOn: []

  experiment-template.expiry-and-renewal:
    question: When does an experiment end by itself, and what does it take to keep it going?
    effort: one_meeting
    dependsOn: []

  learning-log.what-constitutes-a-learnable-event:
    question: What kind of thing going wrong is worth writing down and learning from?
    effort: one_meeting
    dependsOn: []

  learning-log.entry-format:
    question: What do we record about something we learned, so it is still useful in three years?
    effort: one_meeting
    dependsOn: []

  version-history.entry-format:
    question: What do we record about each version of our rules, so anybody can trace what changed?
    effort: one_meeting
    dependsOn: []
