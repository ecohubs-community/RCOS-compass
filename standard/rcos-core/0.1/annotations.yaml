# Compass's annotations for RCOS-Core 0.1.
#
# Kept separate from the standard's own data, and not published upstream, because
# these are this tool's opinion about planning rather than properties of RCOS:
#
#   effort     one_conversation | one_meeting | a_series — so a group can plan a
#              season rather than a decade.
#   dependsOn  sections that make this one easier or safer to answer first. The
#              Path treats these as structural ordering.
#
# The plain-language question, its prompts ("What to cover") and its example
# answers used to live here too. They were written for Compass, then taken into
# the RCOS-website repository, reviewed and translated, and are now published in
# sections.yaml under each locale (`question`, `prompts`, `examples`). The loader
# reads them from there (`StandardView.guidance`), so they reach every locale and
# change only with a deliberate re-vendor. Do not add them back here:
# `pnpm check:standard` rejects any field other than the two above. A change of
# wording is a change upstream.
#
# An entry is optional. A section without one gets `effort: one_meeting` and no
# dependencies — the values the Path assumes. Layers 2–6 all carry exactly that
# today, deliberately: their questions were added to change the wording and
# nothing else, so the order of the Path stayed what it was. Sharpening effort
# and dependencies for these layers is its own piece of work, with its own
# argument.

